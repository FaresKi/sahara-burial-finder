name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (core + dev; heavy extras not needed for tests)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Tests (offline)
        run: uv run pytest -q

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No data, restricted outputs or secrets tracked
        run: |
          bad=$(git ls-files | grep -E '^(data/|outputs/restricted/|\.env$)' || true)
          pub=$(git ls-files outputs/public | grep -v '^outputs/public/.gitkeep$' || true)
          if [ -n "$bad$pub" ]; then
            echo "Tracked files that must never be committed:"; echo "$bad"; echo "$pub"
            exit 1
          fi
