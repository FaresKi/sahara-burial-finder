[project]
name = "sbf"
version = "0.1.0"
description = "Sahara Burial Finder: desk analysis of declassified imagery and open remote sensing"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Fares" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests",
    "geopandas",
    "shapely",
    "rasterio",
    "pyproj",
    "numpy",
    "pandas",
    "pyarrow",
    "opencv-python-headless",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "pydantic>=2",
    "pyyaml",
    "typer",
    "folium",
    "matplotlib",
    "jinja2",
    "pymupdf",
    "tqdm",
]

[project.urls]
Repository = "https://github.com/FaresKi/sahara-burial-finder"

[project.optional-dependencies]
ml = ["torch", "transformers", "timm"]
sam = ["sam2"]
gee = ["earthengine-api", "geemap"]
llm = ["anthropic"]

[project.scripts]
sbf = "sbf.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["heavy: needs optional heavy dependencies (torch, sam2, ee, anthropic); skipped when absent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
